<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0D3B66">

  <title>Iniciar sesión | Salud 360°</title>

  <link rel="stylesheet" href="./css/style.css">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon"
      type="image/png"
      href="./img/imagenes/icons/360_1.png">

  <script type="module" src="./js/auth.js"></script>
</head>

<body class="auth-page">
  <main class="auth-container">

    <div class="auth-logo">
      <div class="auth-logo-image">
       <link rel="icon"
      type="image/png"
      href="./img/imagenes/icons/360_1.png">
      </div>

      <h1>SALUD 360°</h1>
      <p>Gestión Médica Integral</p>
    </div>

    <form id="loginForm" class="auth-box">
      <h2>Bienvenido de nuevo</h2>

      <p class="auth-subtitle">
        Ingresa tus datos para acceder a tu cuenta.
      </p>

      <div class="form-field">
        <label for="correo">Correo electrónico</label>
        <input id="correo"
               type="email"
               autocomplete="email"
               required>
      </div>

      <div class="form-field">
        <label for="password">Contraseña</label>
        <input id="password"
               type="password"
               autocomplete="current-password"
               required>
      </div>

      <button class="btn btn-primary auth-submit"
              id="loginBtn"
              type="submit">
        Iniciar sesión
      </button>

      <p id="mensaje" class="auth-message"
         role="status" aria-live="polite"></p>

      <p class="auth-footer">
        ¿No tienes cuenta?
        <a href="./registro.html">Regístrate</a>
      </p>
    </form>
  </main>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", async () => {
        try {
          const registro =
            await navigator.serviceWorker.register("./sw.js");
          await registro.update();
        } catch (error) {
          console.error("Error del Service Worker:", error);
        }
      });
    }
  </script>
</body>
</html>
