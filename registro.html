<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0D3B66">

  <title>Registro | Salud 360°</title>

  <link rel="stylesheet" href="./css/style.css">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png"
        href="./img/imagenes/icons/salud1.png">

  <script type="module" src="./js/auth.js"></script>
</head>

<body class="auth-page">
  <main class="auth-container">

    <div class="auth-logo">
      <img src="./img/imagenes/icons/salud1.png"
           alt="Salud 360°"
           class="logo-auth">

      <h1>SALUD 360°</h1>
      <p>Crea tu cuenta</p>
    </div>

    <form id="registroForm" class="auth-box">
      <h2>Registro de usuario</h2>

      <div class="form-field">
        <label for="rol">Tipo de usuario</label>
        <select id="rol" required>
          <option value="paciente">Paciente</option>
          <option value="medico">Médico</option>
        </select>
      </div>

      <div class="form-field">
        <label for="nombre">Nombre completo</label>
        <input id="nombre"
               type="text"
               autocomplete="name"
               required>
      </div>

      <div class="form-field">
        <label for="correo">Correo electrónico</label>
        <input id="correo"
               type="email"
               autocomplete="email"
               required>
      </div>

      <div class="form-field">
        <label for="password">Contraseña</label>
        <input id="password"
               type="password"
               minlength="6"
               autocomplete="new-password"
               required>
      </div>

      <div class="form-field">
        <label for="confirmarPassword">
          Confirmar contraseña
        </label>
        <input id="confirmarPassword"
               type="password"
               minlength="6"
               autocomplete="new-password"
               required>
      </div>

      <div id="camposMedico" hidden>
        <div class="form-field">
          <label for="cedula">Cédula profesional</label>
          <input id="cedula" type="text">
        </div>

        <div class="form-field">
          <label for="especialidad">Especialidad</label>
          <input id="especialidad" type="text">
        </div>
      </div>

      <button class="btn btn-primary auth-submit"
              id="registroBtn"
              type="submit">
        Crear cuenta
      </button>

      <p id="mensaje" class="auth-message"
         role="status" aria-live="polite"></p>

      <p class="auth-footer">
        ¿Ya tienes cuenta?
        <a href="./login.html">Inicia sesión</a>
      </p>
    </form>
  </main>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
          .catch(console.error);
      });
    }
  </script>
</body>
</html>
